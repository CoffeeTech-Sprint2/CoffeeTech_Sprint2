<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<style>

    .containerKPIs{
        justify-content: space-between;
        display: flex;

    }

    .caixinhaKPIs{
        background-color: rgb(63, 39, 11);
        font-family: Arial, Helvetica, sans-serif;
        width: 200px;
        height: 100px;
        text-align: center;
        color:whitesmoke;
        display: flex;
        align-items: center;
        align-content: center;
        border-radius: 6px;

    }
    .alerta{
        margin-top: 10px;
        justify-content: center;
        display: flex;

    }
    .caixinhaAlerta{
        background-color: #774409;
        font-family: Arial, Helvetica, sans-serif;
        width: 800px;
        height: 100px;
        text-align: center;
        color: whitesmoke;
        border-radius: 6px;

    }

    .canva {
        width: 1000px; /*altera o tamanho do gráfico aqui*/
        margin: 0 auto 30px;
    }
     
    .tituloGrafico{ 
        /* altera aqui pra seguir o design do site */
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        text-align: center;
    }
</style>
<body>
    <div class="tituloGrafico">
        <h3>KPIs</h3>
    </div>
    <div class="containerKPIs">
        <div class="caixinhaKPIs">
            <span>oie</span>
        </div> 

        <div class="caixinhaKPIs">
            <span>oiee</span>
        </div> 

        <div class="caixinhaKPIs">
            <span>oiie</span>
        </div>

        <div class="caixinhaKPIs">
            <span>oiiie</span>
        </div>

        <div class="caixinhaKPIs">
            <span>oieeeee</span>
        </div>

        
    </div>

    <div class="alerta">
         <div class="caixinhaAlerta">
        <span>ALERTA!!</span>
    </div>

    </div>
   
    
    <div class="tituloGrafico">
    <h3>Gráfico da % de umidade ao longo do dia:</h3>
    </div>


    <div class ="canva">
    <canvas id="graficoUmidade"></canvas>
    </div>
   
    
</body>
</html>
<script>
  const ctx = document.getElementById('graficoUmidade');

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['12h00', '13h00', '14h00', '15h00', '16h00', '17h00', '18h00', '19h00', '20h00'],
      // horas (eixo x)
      datasets: [{
        label: '% de umidade',
        data: [30, 32, 30, 31, 30, 31, 30, 30, 31],
        // porcentagem de umidade (eixo y)
        borderWidth: 1
      }]
    },
    options: {
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
</script>
