<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffe Tech</title>
    <link rel="icon" type="image/png" href="./img/logo-coffetech3.png">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #f5ece0;
            text-align: center;
            padding: 24px 16px;
        }

        h1 {
            font-family: 'DM Serif Display', serif;
            font-weight: 400;
            font-size: 36px;
            color: #12261d;
        }

        p {
            color: #7d8577;
            margin: 8px 0 28px;
        }

        main {
            background: white;
            max-width: 580px;
            margin: auto;
            padding: 40px;
            border: 1px solid #efe3d0;
            border-radius: 24px;
            text-align: left;
        }

        main label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #6f7b72;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            height: 56px;
            padding: 0 20px;
            margin-bottom: 20px;
            font-family: inherit;
            font-size: 16px;
            background: #faf6f0;
            border: 1px solid #ecdcc0;
            border-radius: 12px;
            box-sizing: border-box;
        }

        #linha {
            display: flex;
            gap: 20px;
        }

        #linha div {
            flex: 1;
        }

        #opcoes {
            display: flex;
            gap: 10px;
        }

        #opcoes label {
            flex: 1;
            margin: 0;
            padding: 14px 16px;
            font-size: 15px;
            letter-spacing: 0;
            text-transform: none;
            color: #4a4a4a;
            border: 1px solid #ecdcc0;
            border-radius: 12px;
        }

        input[type="radio"] {
            accent-color: #6b3d2e;
        }

        button {
            width: 100%;
            height: 60px;
            margin-top: 24px;
            font-family: inherit;
            font-size: 18px;
            color: #fdf6ec;
            background: #6b3d2e;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #div_exibir {
            margin-top: 16px;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>Criar conta</h1>
    <p>Comece a monitorar sua plantação hoje</p>

    <main>
        <label>Nome da empresa</label>
        <input type="text" id="ipt_empresa" placeholder="Fazenda Boa Vista Ltda.">

        <label>Nome</label>
        <input type="text" id="ipt_nome" placeholder="João da Silva">

        <label>E-mail</label>
        <input type="text" id="ipt_email" placeholder="joao@empresa.com.br">

        <label>Senha</label>
        <input type="password" id="ipt_senha" placeholder="Mínimo de 8 caracteres">

        <div id="linha">
            <div>
                <label>Celular</label>
                <input type="text" id="ipt_celular" placeholder="(00) 9 0000-0000">
            </div>
            <div>
                <label>Telefone</label>
                <input type="text" id="ipt_telefone" placeholder="(00) 0000-0000">
            </div>
        </div>

        <label>Contato de preferência</label>
        <div id="opcoes">
            <label><input type="radio" name="preferencia"> E-mail</label>
            <label><input type="radio" name="preferencia"> Celular</label>
            <label><input type="radio" name="preferencia"> Telefone</label>
        </div>

        <button onclick="validarCampos()">Cadastrar</button>

        <div id="div_exibir"></div>
    </main>
</body>

<script>
    function validarCampos() {
        let senha = ipt_senha.value;
        let email = ipt_email.value;
        let empresa = ipt_empresa.value;
        let nome = ipt_nome.value;
        let celular = ipt_celular.value;
        let telefone = ipt_telefone.value;

        if (empresa == '' || nome == '' || celular == '' || telefone == '' || email == '' || senha == '') {
            div_exibir.innerHTML = `<span style="color: red;">Todos os campos são obrigatórios!</span>`

        } else if (senha.length >= 8 && senha.toUpperCase() != senha && senha.toLowerCase() != senha && email.includes('@')) {
            div_exibir.innerHTML = `<span style="color: green;">Cadastrado</span>`

        } else {
            div_exibir.innerHTML = `<span style="color: red;">CADASTRO INVÁLIDO!<br>
                                    Inserir e-mail válido!<br>
                                    Senha deve conter 8 caracteres, com letras maiúsculas e minúsculas!</span>`
        }
    }
</script>

</html>
