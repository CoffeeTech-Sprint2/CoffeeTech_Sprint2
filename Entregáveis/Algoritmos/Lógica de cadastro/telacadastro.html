<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffe Tech</title>
    <link rel="icon" type="image/png" href="./img/logo-coffetech3.png">
</head> 


<body>
      <div class="titulo"> 
         <h1>Criar conta</h1>
        <span>Comece a monitorar sua plantação hoje</span> <br>
         <div class="info01">
            



    <span> NOME DA EMPRESA </span> <br>
    <input type="text" id="ipt_empresa" placeholder="Fazenda Boa Vista Ltda"><br><br>

    <span> NOME </span> <br>
    <input type="text" id="ipt_nome" placeholder="João da Silva"><br><br>

    <span> E-MAIL </span> <br>
    <input type="text" id="ipt_email" placeholder="joao@empresa.com.br"><br><br>

    <span> SENHA </span>  <br>
    <input type="password" id="ipt_senha"><br><br>

    <span> CELULAR </span>
    <span> TELEFONE </span> <br>
    <input type="text" id="ipt_celular" placeholder="(00) 9 0000-0000"> 

    <input type="text" id="ipt_telefone" placeholder="(00) 0000-0000"><br><br>

     <span> CONTATO DE PREFERÊNCIA </span> <br>
    <label for="radio_email"> 
        <input type="radio" name="preferencia" id="radio_email">
        E-mail 
    </label>

    <label for="radio_celular"> 
        <input type="radio" name="preferencia" id="radio_celular">
        Celular
    </label>

    <label for="radio_telefone">
        <input type="radio" name="preferencia" id="radio_telefone">
        Telefone
    </label><br><br>

    <button onclick="validarCampos()">Cadastrar</button>

    <div id="div_exibir"></div>

    <span style="color: rgb(255, 0, 0);"></span>
    </div>



</html>
<script>
    function validarCampos(){
        let senha = ipt_senha.value;
        let email = ipt_email.value;
        let empresa = ipt_empresa.value;
        let nome = ipt_nome.value;
        let celular = ipt_celular.value;
        let telefone = ipt_telefone.value;
        
        if(empresa == '' || nome == '' || celular == ''|| telefone == '' || email == '' || senha == ''){
            div_exibir.innerHTML = `<span style="color: rgb(255, 0, 0);">Todos os campos são obrigatórios!</span><br>`

        }else if(senha.length >= 8 && senha.toUpperCase() != senha && senha.toLowerCase() != senha && email.includes('@')){
            div_exibir.innerHTML = `<span style="color: green;">Cadastrado</span>`

        }else if(email.includes('@') && (senha.length >= 8 && senha.toUpperCase() != senha || senha.length >=8 && senha.toLowerCase() != senha)){
            div_exibir.innerHTML = `<span style="color: green;">Cadastrado</span>`
            
        }else if(senha.length >= 8){
            div_exibir.innerHTML = `CADASTRO INVÁLIDO!<br>
                                    Inserir Email válido!<br>
                                    Senha deve conter 8 caracteres!<br>` 
        }

        
    }


</script>
