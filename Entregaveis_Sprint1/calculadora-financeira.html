<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Calculadora financeira</title>
</head>

<body>

    <div class="container">

        <h1>Calculadora financeira</h1>

        <p><small>Valor de referência utilizado: R$ 1.803,73 por saca (60kg) de café arábica — cotação vista em 24/08/2026.</small></p>

        <h3>Dados da Irrigação</h3>

        <p>Valor gasto por mês com água (R$)</p>
        <input type="text" id="ipt_valorAgua" placeholder="Ex: 40000">

        <p>Quantas vezes irriga no mês</p>
        <input type="text" id="ipt_vezes" placeholder="Ex: 4 vezes">

        <h3>Dados da Produção</h3>

        <p>Sacas produzidas por ano</p>
        <input type="text" id="ipt_sacas" placeholder="Ex: 600 sacas"><br>

        <br>

        <button onclick="calcular()">Calcular</button>

        <div id="resultado"></div>

    </div>

</body>

<script>

    function calcular() {

        // --- Dados de entrada ---
        let valorAguaMes = Number(ipt_valorAgua.value);
        let sacas = Number(ipt_sacas.value);

        // --- Valores de referência (exemplo, ajustáveis apenas aqui no código) ---
        let economiaPercentual = 30; // % de economia de água estimada com o sensor
        let valorSaca = 1803.73;
        let perdaSemSensor = 0.30; // 30% de perda estimada sem monitoramento (com base em pesquisas e documentação)
        let perdaComSensor = 0.05; // 5% de perda estimada com monitoramento (com base em pesquisas e documentação)

        // --- Cálculo da economia de água ---
        let economiaAguaMes = valorAguaMes * (economiaPercentual / 100);
        let economiaAguaAno = economiaAguaMes * 12;

        // --- Cálculo da redução de perda de safra ---
        let sacasPerdidasSemSensor = sacas * perdaSemSensor;
        let sacasPerdidasComSensor = sacas * perdaComSensor;
        let sacasRecuperadas = sacasPerdidasSemSensor - sacasPerdidasComSensor;
        let valorRecuperado = sacasRecuperadas * valorSaca;
        let valorProducaoComSensor = (sacas - sacasPerdidasComSensor) * valorSaca;

        // --- Benefício total estimado ---
        let beneficioTotalAno = economiaAguaAno + valorRecuperado;

        resultado.innerHTML = `

        <br><h2>Economia com Irrigação Inteligente</h2><br>

        <small>Essa economia é calculada sobre o valor que você informou gastar hoje por mês com água (R$ ${valorAguaMes.toFixed(2)}), aplicando um percentual médio de redução de consumo de ${economiaPercentual}%, estimado a partir do uso do sensor de umidade do solo, que evita irrigações desnecessárias ao identificar o momento exato em que a planta precisa de água.</small><br><br>

        Economia de água por mês: R$ ${economiaAguaMes.toFixed(2)}<br><br>

        Economia de água por ano: R$ ${economiaAguaAno.toFixed(2)}<br><br>

        <h2>Ganho na Produção</h2><br>

        <small>Os percentuais abaixo (${(perdaSemSensor * 100).toFixed(0)}% sem sensor e ${(perdaComSensor * 100).toFixed(0)}% com sensor) são valores fixos, definidos com base em nossas pesquisas e documentação técnica sobre perdas de safra relacionadas a manejo inadequado de irrigação.</small><br><br>

        Perda estimada sem sensor: ${(perdaSemSensor * 100).toFixed(0)}%<br><br>

        Perda estimada com sensor: ${(perdaComSensor * 100).toFixed(0)}%<br><br>

        <small>O valor recuperado é a diferença de produção que deixa de se perder graças à redução da perda (de ${(perdaSemSensor * 100).toFixed(0)}% para ${(perdaComSensor * 100).toFixed(0)}%), convertida em reais pelo valor da saca de café arábica.</small><br><br>

        Valor recuperado com produção: R$ ${valorRecuperado.toFixed(2)}<br><br>

        Valor total da produção com sensor: R$ ${valorProducaoComSensor.toFixed(2)}<br><br>

        <h2>Benefício Total Estimado (por ano)</h2><br>

        <small>Esse total soma apenas a economia operacional estimada (água + produção recuperada). Ele não inclui o custo de instalação ou aquisição do sensor — representa o ganho financeiro recorrente ao longo de um ano de uso.</small><br><br>

        Economia com água: R$ ${economiaAguaAno.toFixed(2)}<br><br>

        Ganhos totais com as sacas no ano: R$ ${valorProducaoComSensor.toFixed(2)}<br><br>

        <strong>Total economizado: R$ ${beneficioTotalAno.toFixed(2)}</strong>

        `;
    }

</script>

</html>
